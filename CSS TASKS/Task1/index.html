    <style>
      body {
        padding: 50px 100px;

      span {
        font-size: 50px;
        color: red;
      }
      .name {
        font-size: 100px;
        font-weight: 600;
        font-family: sans-serif;
        text-align: center;
        margin-top: 200px;
        margin-bottom: 400px;
      }
      .main {
        display: grid;
        grid-template-columns: auto auto auto;
        column-gap: 50px;
        row-gap: 100px;
      }
      img {
        width: 100%;
        height: 90%;
        object-fit: cover;
        border-radius: 5px;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateX(-100px);
        }
        to {
          opacity: 1;
          transform: translateX(0px);
        }
      }
      img {
        animation: appear linear;
        animation-timeline: view();
        animation-range: entry 0% cover 40%;
      }
    </style>
  </head>
